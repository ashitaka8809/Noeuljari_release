# upload/v0.2.1 같은 가지를 올리면 그 안의 APK로 릴리스를 만들고 가지는 지움 (토큰 필요 없음)
name: publish
on:
  push:
    branches: ['upload/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#upload/}"
          APK="upload/Noeuljari-${TAG}.apk"
          test -f "$APK"
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target main \
            --title "놓을자리 ${TAG#v}" --notes-file "upload/notes-${TAG}.md"
      - name: 올린 가지 지우기
        if: always()
        run: git push origin --delete "$GITHUB_REF_NAME"
